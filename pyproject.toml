[project]
name = "sparjax"
version = "0.1.0"
description = "PPO on a Sebulba actor-learner architecture for two-player PettingZoo AEC games, against pluggable opponents."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Paul Alexander", email = "paulalexander23@live.co.uk" }
]
requires-python = ">=3.12"
keywords = ["reinforcement-learning", "jax", "multi-agent", "pettingzoo", "ppo", "sebulba", "poker"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "jax>=0.12.1",
    "jaxtyping>=0.3.11",
    "numpy>=2.2",
    "pettingzoo>=1.27.0",
    "tyro>=1.0.17",
]

[project.optional-dependencies]
cuda12 = [
    "jax[cuda12]>=0.12.1",
]
openspiel = [
    "open-spiel>=2.0.2",
]

[project.scripts]
sparjax = "sparjax.cli:main"

[project.urls]
Repository = "https://github.com/PaulAlexander23/sparjax"
Documentation = "https://paulalexander23.github.io/sparjax/"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "hypothesis>=6.170.17",
    "open-spiel>=2.0.2",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]
docs = [
    "mkdocs-material>=9.8.2",
    "mkdocstrings[python]>=1.0.8",
]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "NPY",      # numpy
    "PT",       # pytest style
    "D",        # pydocstyle
]

# F722: jaxtyping shape strings such as Float[Array, "batch obs"] look like bad
# forward annotations to pyflakes. This is the workaround recommended by jaxtyping.
ignore = ["F722"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

# ---------------------------------------------------------------------------
# basedpyright
# ---------------------------------------------------------------------------
[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "recommended"
# JAX/numpy APIs return `Any` in many places; flagging every use is noise.
reportAny = false
reportExplicitAny = false
# Ruff owns unused-import / unused-variable style checks.
reportUnusedCallResult = false

[[tool.basedpyright.executionEnvironments]]
root = "tests"
# pytest fixtures and parametrisation are loosely typed.
reportPrivateUsage = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportMissingTypeStubs = false

# ---------------------------------------------------------------------------
# pytest / coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=sparjax",
    "--cov-report=term-missing",
]
markers = [
    "slow: long-running tests (deselect with '-m \"not slow\"')",
    "gpu: tests that need a GPU",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["sparjax"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
